on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
          # this is a built-in strategy in release-please, see "Action Inputs"
          # for more options
          release-type: simple

      - name: Trigger statichost.eu deploy
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          curl -sS -f -X POST "$STATICHOST_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{}'
        env:
          STATICHOST_WEBHOOK_URL: ${{ secrets.STATICHOST_WEBHOOK_URL }}
